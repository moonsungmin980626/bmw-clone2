<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <style>
        header{
            display: flex;
            text-align: center;
            justify-content: space-between;
            padding: 50px 100px;
        }
        .left_menu{
            display: flex;
            text-align: center;

        }
        .menu{
            text-align: center;
        }
        .menu ul{
            list-style: none;
            display: flex;
            gap: 30px;
            text-align: center;

        }
        .right_menu{
            text-align: center;
            gap: 30px;
            display: flex;
        }
        .right_menu i{
        }
    </style>

</head>
<body>
    <header>
        <div class="left_menu">
            <div class="logo">
                <img src="https://www.bmw.co.kr/content/dam/bmw/common/images/logo-icons/BMW/BMW_White_Logo.svg.asset.1670245093434.svg" alt="">
            </div>

            <div class="menu">
                <ul>
                    <li>모델 내 차량 만들기</li>
                    <li>전기차</li>
                    <li>구매하기</li>
                    <li>더 알아보기</li>
                    <li>BMW 드라이빙 센터</li>
                </ul>
            </div>
        </div>

        <div class="right_menu">
            <i class="fa-regular fa-user"></i>
            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-solid fa-location-dot"></i>
            <i class="fa-regular fa-heart"></i>
        </div>
    </header>
</body>
</html>
