<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            /* width: 100%; */
            display: flex;
            justify-content: space-between;
            padding: 20px 100px;
            /* border-bottom: 1px solid white; */
            align-items: center;
            /* margin-left: 100px; */
            position: relative;
        }
        header::after{
            content:"";
            position:absolute;
            bottom:0;
            left:100px;
            right:100px;
            height:1px;
            background:white;
        }
        .left_menu{
            display: flex;
            align-items: center;
            gap: 60px;
        }
        .logo{
            /* margin-right: 50px; */
        }
        .logo img{
            cursor: pointer;
            width: 50px;
        }
        .menu{
            /* text-align: center; */
            color: white;
        }
        .menu ul{
            /* text-decoration: none; */
            list-style: none;
            display: flex;
            gap: 30px;
            /* text-align: center; */
        }
        .menu li{
            display: flex;
            /* overflow: hidden; */
        }
        .menu a{
            text-decoration: none;
            color: white;
        }
        .electricitycar{
            /* position: relative; */
        }
        .submenu{
            width: 100%;
            background-color: white;
            position: absolute;
            top: 100%;
            left: 0;
            max-height: 0;
            overflow: hidden;
            display: flex;
            /* height: 20vw; */
            /* transition: 0.4s ease; */
                /* width:100%; */
           transition:max-height .4s;

        }
        .active{
            max-height: 500px;
        }
        .submenu_left{
            /* width: 100%; */
            margin: 50px 20px 50px 100px;
        }
        .submenu_left ul{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .submenu_right{
            margin: 50px 0px 0px 200px;
        }
        .submenu_right ul{
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .left_title{
            font-size: 20px;
            margin-bottom: 20px;
        }
        .submenu.open{
            /* width: 100%; */
            /* height: 500px; */
            max-height: 1000px;
            /* transition: all 0.4s; */
        }
        .submenu.close{
            width: 0;
            max-height: 0;
            transition: all 0.4s;
            overflow: hidden;
            display: none;
        }
        .submenu a{
            color: #000;
        }
        .right_menu{
            /* text-align: center; */
            align-items: center;
            gap: 30px;
            display: flex;
            color: white;
        }
        .right_menu i{
            cursor: pointer;
            font-size: 20px;
        }
        .icon{

        }
        body{
            height: 100vh;
            background:  linear-gradient(
            rgba(67, 66, 66, 0.45),
            rgba(36, 36, 36, 0.45)
        ),url("https://bmw.scene7.com/is/image/BMW/spiderman_NA5_promotion1:16to7?fmt=webp&wid=1919&fit=wrap%2C+1") no-repeat center center / cover;
            
        }
        .white-header{
            background-color: white;
              /* transition: background-color 1s; */

        }
        .white-header .menu a{ 
            color:black; 
        }
        .white-header .right_menu i{
            color: #000;
        }
        .white-header .logo img{
            
        }
    </style>

</head>
<body>
    <header>
        <div class="left_menu">
            <div class="logo">
                <img class="logoimg" src="https://www.bmw.co.kr/content/dam/bmw/common/images/logo-icons/BMW/BMW_White_Logo.svg.asset.1670245093434.svg" alt="">
            </div>

            <div class="menu">
                <ul>
                    <li><a href="#">모델 내 차량 만들기</a></li>
                    <li class="electricitycar">
                        <a href="#">전기차 <i class="fa-solid fa-chevron-down"></i></a>
                        
                        <div class="submenu">
                            <div class="submenu_left">
                                <ul>
                                    <li class="left_title"><a href="">BMW 전기차</a></li>
                                    <li><a href="">BMW 순수 전기 모델</a></li>
                                    <li><a href="">BMW 플러그인 하이브리드 모델</a></li>
                                    <li><a href="">BMW i 소울메이트</a></li>
                                    <li><a href="">BMW BEV MEMBERSHIP</a></li>
                                    <li><a href="">전기차의 비용</a></li>
                                </ul>
                            </div>

                            <div class="submenu_right">
                                <ul>
                                    <li class="left_title"><a href="">BMW 차징 & 배터리</a></li>
                                    <li><a href="">BMW 차징</a></li>
                                    <li><a href="">BMW 차징 앱</a></li>
                                    <li><a href="">BMW HV Warn Call</a></li>
                                    <li><a href="">배터리 제조사 안내</a></li>
                                </ul>
                            </div>
                        </div>
                    </li>
                    <li><a href="#">구매하기 <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="#">더 알아보기 <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="#"><strong>BMW</strong> 드라이빙 센터</a></li>
                </ul>
            </div>
        </div>

        <div class="right_menu">
            <i class="fa-regular fa-user"></i>
            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-solid fa-location-dot"></i>
            <i class="fa-regular fa-heart"></i>
        </div>
    </header>

    <script>
      const electricitycar = document.querySelector('.electricitycar');
const submenu = document.querySelector('.submenu');
const header = document.querySelector('header');
const logoimg = document.querySelector('.logoimg');

let closeTimer; // setTimeout을 저장할 변수

electricitycar.addEventListener('click', function(event) {

    // a 태그의 기본 이동 방지
    event.preventDefault();

    // 기존에 실행 중인 타이머가 있으면 취소
    clearTimeout(closeTimer);


    // 메뉴가 열려 있다면
    if (submenu.classList.contains("open")) {

        // 메뉴 닫기
        submenu.classList.remove("open");

        // 0.3초 뒤 헤더 원래대로 변경
        closeTimer = setTimeout(() => {

            header.classList.remove('white-header');

            logoimg.src =
            "https://www.bmw.co.kr/content/dam/bmw/common/images/logo-icons/BMW/BMW_White_Logo.svg.asset.1670245093434.svg";

        }, 300);

    } else {

        // 메뉴 열기
        submenu.classList.add("open");

        // 헤더 흰색으로 변경
        header.classList.add('white-header');

        // 로고 변경
        logoimg.src =
        "https://www.bmw.co.kr/content/dam/bmw/common/images/logo-icons/BMW/BMW_Grey-Colour_RGB.svg.asset.1756199978277.svg";

    }

});



// 전기차 메뉴를 눌렀을떄는 스르륵 내려오는데 한번더 메뉴를 누르면 한번에 사라지기 





// 
    </script>
</body>
</html>
