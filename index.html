<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        header{
            width: 80%;
            display: flex;
            justify-content: space-between;
            padding: 20px 100px;
            border-bottom: 1px solid white;
            align-items: center;
            /* margin-left: 100px; */
        }
        .left_menu{
            display: flex;
            align-items: center;
            gap: 60px;
        }
        .logo{
            /* margin-right: 50px; */
        }
        .logo img{
            cursor: pointer;
            width: 50px;
        }
        .menu{
            text-align: center;
            color: white;
        }
        .menu ul{
            /* text-decoration: none; */
            list-style: none;
            display: flex;
            gap: 30px;
            text-align: center;

        }
        .menu a{
            text-decoration: none;
            color: white;
        }
        .right_menu{
            /* text-align: center; */
            align-items: center;
            gap: 30px;
            display: flex;
            color: white;
        }
        .right_menu i{
            cursor: pointer;
            font-size: 20px;
        }
        .icon{

        }
        body{
            height: 100vh;
            background:  linear-gradient(
            rgba(67, 66, 66, 0.45),
            rgba(36, 36, 36, 0.45)
        ),url("https://bmw.scene7.com/is/image/BMW/spiderman_NA5_promotion1:16to7?fmt=webp&wid=1919&fit=wrap%2C+1") no-repeat center center / cover;
            
        }
    </style>

</head>
<body>
    <header>
        <div class="left_menu">
            <div class="logo">
                <img src="https://www.bmw.co.kr/content/dam/bmw/common/images/logo-icons/BMW/BMW_White_Logo.svg.asset.1670245093434.svg" alt="">
            </div>

            <div class="menu">
                <ul>
                    <li><a href="#">모델 내 차량 만들기</a></li>
                    <li><a href="#">전기차 <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="#">구매하기 <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="#">더 알아보기 <i class="fa-solid fa-chevron-down"></i></a></li>
                    <li><a href="#"><strong>BMW</strong> 드라이빙 센터</a></li>
                </ul>
            </div>
        </div>

        <div class="right_menu">
            <i class="fa-regular fa-user"></i>
            <i class="fa-solid fa-cart-shopping"></i>
            <i class="fa-solid fa-location-dot"></i>
            <i class="fa-regular fa-heart"></i>
        </div>
    </header>
</body>
</html>
